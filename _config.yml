title: "Awesome Directories"
description: "A curated list of 100+ online directories where SaaS, AI tools, startups, and dev products get backlinks, traffic, and customers."
theme: jekyll-theme-cayman

plugins:
  - jekyll-seo-tag
  - jekyll-readme-index
  - jekyll-sitemap

author:
  name: Pawel Boguta
  url: https://batchlisted.com

twitter:
  card: summary

show_downloads: false

keywords: "best online directories, directories for SaaS, startup directories, AI tool directories, directories for backlinks"

# Jekyll generates pretty URLs; default layout applies cayman to README
defaults:
  - scope:
      path: ""
    values:
      layout: default

exclude:
  - .github/
  - CONTRIBUTING.md
  - CODE_OF_CONDUCT.md
  - _push.cjs
